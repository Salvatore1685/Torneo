/* Se nella cartella c'e' un file sfondo.jpg viene usato al posto di quello disegnato */
.bgimg body::after{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(4,9,20,.28),rgba(4,9,20,.62)),url(sfondo.jpg) center/cover no-repeat}
header{padding:14px 14px 8px;display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
header .logo{font-size:26px}
header input,header h1{flex:1;min-width:0;margin:0;font-size:19px;font-weight:700;background:transparent;border:0;color:var(--tx);padding:4px 0}
header input:focus{outline:none;border-bottom:1px solid var(--ac)}
.sync{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:5px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#777}
.dot.ok{background:var(--ac)}.dot.slow{background:var(--ac2)}
.keybtn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 11px;font-size:12px;white-space:nowrap}
.keybtn.on{border-color:var(--ac);color:var(--ac)}
#stx{display:none}
.bell{position:relative}
.cm{max-width:84%;margin:0 0 8px;padding:7px 11px;border-radius:14px;background:var(--card2);border:1px solid var(--bd);word-break:break-word}
.cm.me{margin-left:auto;background:rgba(61,220,132,.16);border-color:rgba(61,220,132,.45)}
.cm .cn{font-size:11px;color:var(--mut);margin-bottom:2px;display:flex;gap:6px;align-items:center}
.cm .cn b{color:var(--ac2)}.cm .cn i{font-style:normal;background:var(--ac);color:#06210f;border-radius:6px;padding:0 5px;font-size:10px;font-weight:800}
.cm .cx{background:none;border:0;color:var(--red);font-size:12px;padding:0 2px;margin-left:auto}
.cbar{position:sticky;bottom:-40px;margin:0 -14px -40px;padding:10px 14px 40px;background:rgba(8,16,16,.97);border-top:1px solid var(--bd)}
.bell .bd{position:absolute;top:-6px;right:-4px;background:var(--red);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:99px;display:grid;place-items:center;padding:0 3px}
.ro{background:var(--card2);color:var(--ac2);font-size:12px;padding:8px 14px;margin:0 auto 6px;border-radius:8px;max-width:612px}
nav{display:flex;gap:6px;padding:6px 14px;position:sticky;top:0;background:linear-gradient(rgba(6,11,24,.92),rgba(6,11,24,.7));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:5;overflow-x:auto;max-width:640px;margin:0 auto}
nav button{flex:1 0 auto;white-space:nowrap;border:1px solid var(--bd);background:rgba(18,32,26,.85);color:var(--mut);padding:9px 10px;border-radius:10px;font-size:14px}
nav button.on{background:var(--ac);color:#06210f;border-color:var(--ac);font-weight:700}
main{padding:8px 14px;max-width:640px;margin:0 auto}
.card{background:rgba(18,32,26,.80);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.empty{text-shadow:0 1px 6px #000,0 0 12px #000;color:#c3d4c8;text-align:center;padding:28px 10px;line-height:1.5}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 4px;text-align:center;font-size:14px}
th{color:var(--mut);font-weight:600;font-size:12px}
td.n,th.n{text-align:left}
tr+tr td{border-top:1px solid var(--bd)}
td.pt{font-weight:800;color:var(--ac)}
.mc{cursor:pointer}
.gbox{background:rgba(18,32,26,.55);border:1px solid var(--bd);border-radius:16px;padding:8px 8px 2px;margin-bottom:14px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.gbox .gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 6px 8px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.gbox .gh b{color:var(--tx);font-size:13px}
.gbox .card{background:rgba(8,16,12,.55);margin-bottom:8px}
.gbox.champ{background:rgba(8,22,64,.62);border-color:#2f5fc4}
.gbox.champ .gh{color:#9db8ff}
.card.champ{background:rgba(16,44,112,.82);border-color:#2f5fc4}
.btn.cb{background:#2f5fc4;color:#fff;border-color:#2f5fc4}
/* tema blu Champions: schede e finestre; il pulsante "Invia avviso" resta com'e' */
.th-champ .card:not(.mc),.card.champ.set{background:rgba(16,44,112,.62);border-color:#2f5fc4}
.th-champ input,.th-champ select,.th-champ textarea,.sheet.champ input,.sheet.champ select,.sheet.champ textarea,.card.champ input,.card.champ select{background:rgba(8,26,78,.9);border-color:#2f5fc4}
.th-champ .btn.s:not(#gsend):not(#msend),.sheet.champ .btn.s:not(#gsend):not(#msend){background:rgba(8,26,78,.9);border:1px solid #2f5fc4;color:#cfe0ff}
.th-champ .chip,.card.champ .chip{background:rgba(8,26,78,.9);border-color:#2f5fc4}
.th-champ .chip.on,.card.champ .chip.on{background:#2f5fc4;color:#fff;border-color:#2f5fc4}
.th-champ th,.th-champ .note,.th-champ label{color:#9db8ff}
.th-champ td.pt{color:#8fb4ff}
.th-champ tr{border-color:#2f5fc4}
.card.champ .btn:not(.d):not(.s){background:#2f5fc4;color:#fff}
.sheet.champ .btn:not(.s):not(.d):not(#msend){background:#2f5fc4;color:#fff}
.mrow{display:flex;align-items:center;gap:8px}
.mrow .t{flex:1;font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;min-width:0}
.mrow .t.r{justify-content:flex-end;text-align:right}
.sc{font-size:22px;font-weight:800;min-width:70px;text-align:center}
.mmeta{display:flex;justify-content:space-between;margin-top:6px;color:var(--mut);font-size:12px}
.badge{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--card2);color:var(--mut)}
.badge.live{background:var(--red);color:#fff}
.badge.fin{background:#24402e;color:var(--ac)}
.badge.rinv{background:#4a3a14;color:var(--ac2)}
.ev{margin-top:6px;font-size:12px;color:var(--mut);line-height:1.5}
.btn{border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700;background:var(--ac);color:#06210f}
.btn.s{background:var(--card2);color:var(--tx);border:1px solid var(--bd)}
.btn.d{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn.w{width:100%}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.row>.btn{flex:none}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:10px;font-size:16px;font-family:inherit}
label{display:block;color:var(--mut);font-size:12px;margin:10px 0 4px}
h3{margin:14px 0 8px;font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.note{color:var(--mut);font-size:13px;line-height:1.45;margin:6px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 11px;border-radius:99px;border:1px solid var(--bd);background:var(--card2);font-size:13px;color:var(--mut)}
.chip.on{background:var(--ac);color:#06210f;border-color:var(--ac);font-weight:700}
.chip.x{display:inline-flex;gap:8px;align-items:center;color:var(--tx)}
.chip.x b{color:var(--red);cursor:pointer;padding:0 2px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:20}
#modal.show{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;top:30px;background:rgba(8,16,16,.97);border-radius:18px 18px 0 0;overflow-y:auto;padding:14px 14px 40px;max-width:640px;margin:0 auto;border:1px solid var(--bd)}
.sheet.champ{background:rgba(6,16,46,.98);border-color:#2f5fc4}
.sheet.champ .card{background:rgba(16,44,112,.55);border-color:#2f5fc4}
.sheet.champ .top button{background:#1c3f94}
.sheet.champ .chip{background:rgba(16,44,112,.55);border-color:#2f5fc4}
.sheet.champ .chip.on{background:#2f5fc4;color:#fff;border-color:#2f5fc4}
.sheet .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}

</style>
</head>
<body>
<header>
  <div class="logo" id="logo">⚽</div>
  <div id="title" style="flex:1;min-width:0"></div>
  <div id="hctl"><div class="sync"><span class="dot" id="dot"></span><span id="stx">connessione…</span></div>
  <button class="keybtn bell" id="chatbtn" data-act="chat">💬</button>
  <button class="keybtn bell" id="bellbtn" data-act="bell">🔔</button>
  <button class="keybtn" id="keybtn" data-act="login">🔑</button></div>
</header>
<div id="banner"></div>
<nav id="nav"></nav>
<main id="main"></main>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<input type="file" id="filepick" accept="image/*" class="vh">

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth, signInAnonymously} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore, doc, collection, query, orderBy, limit, onSnapshot, setDoc, updateDoc, deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";

const safeImg = v => (typeof v === 'string' && /^data:image\/(png|jpeg|webp|gif|svg\+xml);base64,/.test(v) && v.length < 400000) ? v : '';
// stemma: immagine della squadra, oppure cerchietto con l'iniziale
function crest(id, size) {
  if (!id || !teams[id]) return '';
  const im = safeImg(teams[id].crest);
  if (im) return `<span class="cr img" style="width:${size}px;height:${size}px"><img src="${im}" alt=""></span>`;
  return `<span class="cr" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .45)}px">${esc((teams[id].name || '?').trim().charAt(0).toUpperCase())}</span>`;
}
let pickTarget = null;
let crop = null;   // {img, kind, id, fw, fh, fit, fill, z, ox, oy}: inquadratura di stemma o logo
function cropFrame(fw, fh) {
  crop.fw = fw; crop.fh = fh;
  crop.fit = Math.min(fw / crop.img.width, fh / crop.img.height);
  crop.fill = Math.max(fw / crop.img.width, fh / crop.img.height);
  crop.z = 1; crop.ox = crop.oy = 0;
}
function cropDraw(ctx, k) {
  const W = crop.fw * k, H = crop.fh * k, sc = crop.fit * crop.z * k, w = crop.img.width * sc, h = crop.img.height * sc;
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(crop.img, (W - w) / 2 + crop.ox * k, (H - h) / 2 + crop.oy * k, w, h);
}
function drawCrop() { const cv = $('#cropcv'); if (cv && crop) cropDraw(cv.getContext('2d'), 1); }
function openCrop(file, kind, id) {
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    crop = {img, kind, id, url};
    cropFrame(240, 240);
    modalKind = 'crop'; render(); drawCrop();
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Immagine non leggibile'); };
  img.src = url;
}
function setZoom(z) { crop.z = z; const r = $('#cropz'); if (r) r.value = z; drawCrop(); }
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);

let fs = null, auth = null, me = null;
let role = 'none';                // 'none' | 'ref' (arbitro) | 'admin' (organizzatore)
const W = () => role === 'ref' || role === 'admin';   // puo' segnare gol, formazioni, stato
const A = () => role === 'admin';                     // puo' gestire squadre, partite, impostazioni
let teams = {}, matches = {}, meta = {name: 'Torneo di Calcio a 5'};
let tab = 'classifica', openId = null, modalKind = null;
let form = {type: 'gol', team: '', player: '', min: ''};
let armed = null, armTimer = null, dirty = false, loginMsg = '';
let calSel = {camp: 0, champ: 0}, gsel = null, comp = 'camp';
let gtimes = {camp: {}, champ: {}}, gnot = {camp: {}, champ: {}};   // gnot: ultimo valore 'data|ora' notificato per giornata
let gdates = {}, gdatesC = {}, notices = [], seenTs = 0, noticeBoot = false;
const pad = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const okISO = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '');
const parseISO = v => { const [y, m, d] = v.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtShort = v => okISO(v) ? parseISO(v).toLocaleDateString('it-IT', {weekday: 'short', day: '2-digit', month: '2-digit'}) : '';
const fmtLong = v => okISO(v) ? parseISO(v).toLocaleDateString('it-IT', {weekday: 'long', day: 'numeric', month: 'long'}) : '';
const fmtTs = t => { const d = new Date(t); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
let chat = [], chatSeen = 0, chatDraft = '', chatLast = 0;
const CSEEN = 'torneo-chatseen', CNICK = 'torneo-nick';
const nickGet = () => { try { return localStorage.getItem(CNICK) || ''; } catch (e) { return ''; } };
const nickSet = v => { try { localStorage.setItem(CNICK, v); } catch (e) {} };
const chatUnseen = () => chat.filter(m => m.ts > chatSeen && m.u !== me).length;
const chatOn = () => meta.chat !== false;
function chatSeenNow() { if (chat.length) { chatSeen = chat[chat.length - 1].ts; try { localStorage.setItem(CSEEN, String(chatSeen)); } catch (e) {} } }
const SEEN = 'torneo-seen';
const seenGet = () => { try { const v = localStorage.getItem(SEEN); return v === null ? null : +v; } catch (e) { return null; } };
const seenSet = v => { seenTs = v; try { localStorage.setItem(SEEN, String(v)); } catch (e) {} };
const unseen = () => notices.filter(n => n.ts > seenTs).length;
let ready = {teams: false, matches: false, meta: false};
let syncState = 'load';
const STORE = 'torneo-code';

const STATUS = {prog: 'Da giocare', live: 'In corso', fin: 'Finita', rinv: 'Rinviata'};
const EV = {gol: '⚽ Gol', rig: '⚽ (R) Rigore', auto: '↩️ Autogol', giallo: '🟨 Giallo', rosso: '🟥 Rosso'};
const EVI = {gol: '⚽', rig: '⚽ (R)', auto: '↩️', giallo: '🟨', rosso: '🟥'};

/* ---------- accesso al database ---------- */
const ref = p => doc(fs, ...p.split('/'));
const DB = {merge: (p, d) => setDoc(ref(p), d, {merge: true}), set: (p, d) => setDoc(ref(p), d), update: (p, d) => updateDoc(ref(p), d), del: p => deleteDoc(ref(p))};

/* ---------- scrittura: una alla volta, in coda ---------- */
let queue = Promise.resolve();
function write(fn) {
  if (!fs) { toast('Database non configurato'); return Promise.resolve(); }
  queue = queue.then(fn).catch(e => {
    if (e && e.code === 'permission-denied') { toast('Permesso negato: accedi di nuovo con la password'); verifyRole(); }
    else toast('Salvataggio non riuscito, riprova');
  });
  return queue;
}
function toast(t, go) {
  const el = $('#toast'); el.textContent = t; el.style.display = 'block';
  el.dataset.act = go ? 'gonotice' : ''; el.dataset.c = go ? go.c : ''; el.dataset.g = go ? go.g : '';
  el.style.cursor = go ? 'pointer' : ''; el.style.pointerEvents = go ? 'auto' : 'none';
  clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', go ? 6000 : 2800);
}
const store = {
  get() { try { return localStorage.getItem(STORE); } catch (e) { return null; } },
  set(v) { try { localStorage.setItem(STORE, v); } catch (e) {} },
  del() { try { localStorage.removeItem(STORE); } catch (e) {} }
};

/* ---------- accesso con password ---------- */
// Scrive il codice nel proprio documento: le regole del database lo accettano
// solo se coincide con la password attuale. Cosi' la password non sta mai nella pagina.
async function tryCode(code) {
  for (const [col, r] of [['admins', 'admin'], ['refs', 'ref']]) {
    try { await setDoc(doc(fs, col, me), {code}); return r; }
    catch (e) { if (!e || e.code !== 'permission-denied') throw e; }
  }
  return null;
}
async function verifyRole() {
  const code = store.get();
  if (!code || !me) { role = 'none'; render(); return; }
  try {
    const r = await tryCode(code);
    if (r) role = r; else { role = 'none'; store.del(); }
  } catch (e) { /* offline: mantieni lo stato attuale */ }
  if (!A() && tab === 'gestione') tab = 'classifica';
  render();
}
async function doLogin() {
  const el = $('#lg-pw'); const code = el.value.trim();
  if (!code) return;
  loginMsg = 'Verifica…'; renderModal(true);
  try {
    const r = await tryCode(code);
    if (r) { role = r; store.set(code); loginMsg = ''; modalKind = null; toast(r === 'admin' ? 'Accesso organizzatore' : 'Accesso arbitro'); }
    else loginMsg = 'Password errata';
  } catch (e) { loginMsg = 'Connessione assente, riprova'; }
  render();
}
async function logout() {
  store.del(); const was = role; role = 'none'; modalKind = null;
  if (me && fs) { for (const c of ['admins', 'refs']) { try { await deleteDoc(doc(fs, c, me)); } catch (e) {} } }
  if (!A() && tab === 'gestione') tab = 'classifica';
  render(); toast('Uscito');
}

/* ---------- calcoli ---------- */
// Finale: le squadre sono le vincitrici delle semifinali (calcolate, non salvate)
const hid = m => m.fase === 'final' ? winner(matches.sf1) : m.home;
const aid = m => m.fase === 'final' ? winner(matches.sf2) : m.away;
function score(m) {
  const H = hid(m);
  let h = 0, a = 0;
  (m.events || []).forEach(e => {
    if (e.t === 'gol' || e.t === 'rig') e.team === H ? h++ : a++;
    else if (e.t === 'auto') e.team === H ? a++ : h++;
  });
  return [h, a];
}
// vincitrice: chi segna di piu'; in caso di pareggio conta la scelta "rigori" (home/away)
function winner(m) {
  if (!m || m.status !== 'fin') return null;
  const H = hid(m), Aw = aid(m); if (!H || !Aw) return null;
  const [x, y] = score(m);
  if (x > y) return H;
  if (y > x) return Aw;
  return m.pen === 'home' ? H : m.pen === 'away' ? Aw : null;
}
const nm = (m, side) => {
  const id = side === 'h' ? hid(m) : aid(m);
  if (id) return tn(id);
  return m.fase === 'final' ? 'Vincitrice semifinale ' + (side === 'h' ? '1' : '2') : '—';
};
function standings(c) {
  c = c || 'camp';
  const t = {};
  Object.entries(teams).forEach(([id, x]) => t[id] = {id, name: x.name, g: 0, v: 0, n: 0, p: 0, gf: 0, gs: 0, pt: 0});
  Object.values(matches).forEach(m => {
    if (m.fase || mcomp(m) !== c || m.status !== 'fin' || !t[m.home] || !t[m.away]) return;
    const [h, a] = score(m), H = t[m.home], A_ = t[m.away];
    H.g++; A_.g++; H.gf += h; H.gs += a; A_.gf += a; A_.gs += h;
    if (h > a) { H.v++; A_.p++; H.pt += 3; }
    else if (h < a) { A_.v++; H.p++; A_.pt += 3; }
    else { H.n++; A_.n++; H.pt++; A_.pt++; }
  });
  return Object.values(t).sort((x, y) => y.pt - x.pt || (y.gf - y.gs) - (x.gf - x.gs) || y.gf - x.gf || x.name.localeCompare(y.name));
}
function scorers(c) {
  c = c || 'camp';
  const s = {};
  Object.values(matches).filter(m => mcomp(m) === c).forEach(m => (m.events || []).forEach(e => {
    if (!e.player) return;
    const k = e.team + '|' + e.player;
    s[k] = s[k] || {player: e.player, team: e.team, g: 0, y: 0, r: 0};
    if (e.t === 'gol' || e.t === 'rig') s[k].g++; else if (e.t === 'giallo') s[k].y++; else if (e.t === 'rosso') s[k].r++;
  }));
  return Object.values(s).filter(x => x.g || x.y || x.r)
    .sort((a, b) => b.g - a.g || a.r - b.r || a.y - b.y || a.player.localeCompare(b.player));
}
// due competizioni parallele con le stesse squadre: Campionato (comp 'camp') e Champions (comp 'champ', con semifinali e finale)
const mcomp = m => (m.fase || m.comp === 'champ') ? 'champ' : 'camp';
const hasChamp = () => Object.values(matches).some(m => mcomp(m) === 'champ');
const curComp = () => (comp === 'champ' && hasChamp()) ? 'champ' : 'camp';
const GD = c => c === 'champ' ? gdatesC : gdates;
// data e ora effettive di una partita: quelle della singola partita, altrimenti quelle della sua giornata
const effDate = m => m.date || (m.giornata ? GD(mcomp(m))[m.giornata] : '') || '';
const effTime = m => m.time || (m.giornata ? gtimes[mcomp(m)][m.giornata] : '') || '';
const okT = v => /^\d{2}:\d{2}$/.test(v || '');
const GDOC = c => c === 'champ' ? 'giornateC' : 'giornate';
const tn = id => teams[id] ? teams[id].name : '—';
// Metodo del cerchio: ogni giro completo = (n-1) giornate se n pari, n giornate se dispari (con un turno di riposo)
function cycleLen(N) { return N % 2 === 0 ? N - 1 : N; }
function buildCalendar(ids, giornate) {
  const t = ids.slice(); if (t.length % 2) t.push(null);
  const n = t.length, R = n - 1, out = [];
  let arr = t.slice();
  for (let g = 0; g < giornate; g++) {
    const r = g % R, cyc = Math.floor(g / R);
    if (r === 0) arr = t.slice();
    const pairs = [];
    for (let i = 0; i < n / 2; i++) {
      const x = arr[i], y = arr[n - 1 - i];
      if (x === null || y === null) continue;
      let home = ((r + i) % 2 === 0) ? x : y;
      if (i === 0) home = (r % 2 === 0) ? x : y;
      let away = home === x ? y : x;
      if (cyc % 2 === 1) [home, away] = [away, home];   // ritorno: casa e trasferta invertite
      pairs.push([home, away]);
    }
    out.push(pairs);
    arr = [arr[0], arr[n - 1], ...arr.slice(1, n - 1)];
  }
  return out;
}
function sortedMatches() {
  const o = {live: 0, prog: 1, rinv: 1, fin: 2};
  return Object.values(matches).sort((a, b) => (o[a.status] - o[b.status]) || ((a.ord || 0) - (b.ord || 0)));
}

/* ---------- render ---------- */
// stato dei pulsanti della giornata, calcolato dai campi a video (si aggiorna mentre scrivi, senza dover toccare altro)
// aggiorna subito lo stato locale, cosi' due modifiche ravvicinate non si sovrascrivono
function gdateLocal(c, dd, tt) { if (c === 'champ') { gdatesC = dd; gtimes.champ = tt; } else { gdates = dd; gtimes.camp = tt; } }
function updG() {
  const d = document.querySelector('[data-f=gdate]'), t = document.querySelector('[data-f=gtime]'), b = $('#gsend'), x = $('#gclear');
  if (!d || !t || !b) return;
  const c = d.dataset.c === 'champ' ? 'champ' : 'camp', g = +d.dataset.g;
  const dv = okISO(d.value) ? d.value : '', tv = okT(t.value) ? t.value : '', same = gnot[c][g] === dv + '|' + tv, can = !!dv && !!tv && !same;
  b.disabled = !can; b.className = 'btn w' + (can ? '' : ' s'); b.style.flex = '1'; b.textContent = same ? '✓ Avviso inviato' : '🔔 Invia avviso';
  if (x) x.disabled = !(dv || tv);
}
// pulsanti data/ora della singola partita (aperta nella finestra)
function updM() {
  const d = document.querySelector('[data-f=mdate]'), t = document.querySelector('[data-f=mtime]'), b = $('#msend'), x = $('#mclear'), m = matches[openId];
  if (!d || !t || !b || !m) return;
  const dv = okISO(d.value) ? d.value : '', tv = okT(t.value) ? t.value : '', same = (m.nt || '') === dv + '|' + tv, can = !!dv && !!tv && !same;
  b.disabled = !can; b.className = 'btn w' + (can ? '' : ' s'); b.style.flex = '1'; b.textContent = same ? '✓ Avviso inviato' : '🔔 Invia avviso';
  if (x) x.disabled = !(dv || tv);
}
function render() {
  dirty = false;
  const a = A();
  $('#title').innerHTML = a
    ? `<input id="tname" value="${esc(meta.name)}" maxlength="60" aria-label="Nome torneo">`
    : `<h1>${esc(meta.name)}</h1>`;
  $('#dot').className = 'dot ' + (syncState === 'ok' ? 'ok' : syncState === 'slow' ? 'slow' : '');
  $('#stx').textContent = syncState === 'ok' ? 'live' : syncState === 'slow' ? 'non raggiungibile' : syncState === 'off' ? 'offline' : '…';
  updateBell(); updateChatBadge();
  document.querySelector('header').classList.toggle('haslogo', !!safeImg(meta.logo));
  $('#logo').innerHTML = safeImg(meta.logo) ? `<img src="${safeImg(meta.logo)}" alt="">` : '⚽';
  const kb = $('#keybtn');
  kb.textContent = role === 'admin' ? '🔑 Admin' : role === 'ref' ? '🔑 Arbitro' : '🔑 Accedi';
  kb.className = 'keybtn' + (role !== 'none' ? ' on' : '');
  $('#banner').innerHTML = !fs ? '<div class="ro">Database non configurato: compila il file firebase-config.js (vedi GUIDA.md).</div>'
    : role === 'none' ? '<div class="ro">Sola lettura. Se gestisci il torneo, tocca “Accedi” e inserisci la password.</div>' : '';
  const tabs = [['classifica', 'Classifica'], ['partite', 'Partite'], ['finali', 'Finali'], ['marcatori', 'Marcatori'], ['squadre', 'Squadre']];
  if (a) tabs.push(['gestione', 'Gestione']);
  $('#nav').innerHTML = tabs.map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" data-act="tab" data-k="${k}">${l}</button>`).join('');
  $('#main').className = ((tab === 'classifica' || tab === 'marcatori' || (tab === 'partite' && comp !== 'cal')) && curComp() === 'champ') || tab === 'finali' ? 'th-champ' : '';
  $('#main').innerHTML = tab === 'classifica' ? vClass() : tab === 'partite' ? vMatches() : tab === 'finali' ? vFinals() : tab === 'marcatori' ? vScorers() : tab === 'squadre' ? vTeams() : vSettings();
  renderModal();
  updG();
}
// Aggiornamento da database: non cancella cio' che si sta scrivendo
function renderSnap() {
  const ae = document.activeElement;
  if (ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && $('#main').contains(ae)) { dirty = true; updateHeader(); return; }
  render();
}
function updateChatBadge() {
  const n = chatUnseen(), b = $('#chatbtn');
  if (b) b.innerHTML = '💬' + (n ? `<span class="bd">${n > 9 ? '9+' : n}</span>` : '');
}
function updateBell() {
  const n = unseen();
  $('#bellbtn').innerHTML = '🔔' + (n ? `<span class="bd">${n > 9 ? '9+' : n}</span>` : '');
}
function updateHeader() {
  updateBell();
  $('#dot').className = 'dot ' + (syncState === 'ok' ? 'ok' : syncState === 'slow' ? 'slow' : '');
}

function champCard(name, label, id) {
  return `<div class="card" style="text-align:center;border-color:var(--ac2)"><div style="font-size:34px">🏆</div>${id ? `<div style="margin:4px 0">${crest(id, 64)}</div>` : ''}<div style="font-size:12px;color:var(--mut);letter-spacing:.1em">${label}</div><div style="font-size:21px;font-weight:800;color:var(--ac2)">${esc(name)}</div></div>`;
}
// il campionato e' finito quando esiste almeno una partita e tutte (fase finale esclusa) sono "Finita"
function leagueChampion(c) {
  c = c || 'camp';
  const L = Object.values(matches).filter(m => !m.fase && mcomp(m) === c);
  if (!L.length || L.some(m => m.status !== 'fin')) return null;
  const st = standings(c);
  return st.length ? st[0] : null;
}
function compSwitch(withCal) {
  if (!withCal && !hasChamp()) return '';
  const c = (withCal && comp === 'cal') ? 'cal' : curComp();

  if (f === 'gdate' || f === 'gtime') updG();
  if (f === 'mdate' || f === 'mtime') updM();
  if (el.dataset.tn && A()) { const name = el.value.trim(); if (!name) { el.value = (teams[el.dataset.tn] || {}).name || ''; return toast('Il nome non può essere vuoto'); } if (teams[el.dataset.tn] && teams[el.dataset.tn].name !== name) write(async () => { await DB.update('teams/' + el.dataset.tn, {name}); toast('Nome squadra aggiornato'); }); return; }
  if (el.id === 'tname') { const name = el.value.trim() || 'Torneo di Calcio a 5'; write(() => DB.merge('meta/info', {name})); return; }
  if (!f) return;
  if (f === 'type') { form.type = el.value; render(); }
  else if (f === 'team') { form.team = el.value; form.player = ''; render(); }
  else if (f === 'status') { const mid = openId, v = el.value; write(() => DB.update('matches/' + mid, {status: v})); }
  else if (f === 'gdate' || f === 'gtime') {
    if (!A()) return;
    const c = el.dataset.c === 'champ' ? 'champ' : 'camp', g = +el.dataset.g;
    const de = document.querySelector('[data-f=gdate]'), te = document.querySelector('[data-f=gtime]');
    const nd = okISO(de.value) ? de.value : '', nt = okT(te.value) ? te.value : '';
    const dd = {...GD(c)}, tt = {...gtimes[c]};
    nd ? dd[g] = nd : delete dd[g]; nt ? tt[g] = nt : delete tt[g];
    gdateLocal(c, dd, tt);
    write(async () => { await DB.set('meta/' + GDOC(c), {d: dd, t: tt, n: gnot[c]}); toast('Salvato. Tocca "Invia avviso" per avvisare tutti'); });
  }
  else if (f === 'mdate' || f === 'mtime') {
    if (!A()) return;
    const mid = openId, m = matches[mid]; if (!m) return;
    const de = document.querySelector('[data-f=mdate]'), te = document.querySelector('[data-f=mtime]');
    const date = okISO(de.value) ? de.value : '', time = okT(te.value) ? te.value : '';
    write(() => DB.update('matches/' + mid, {date, time}));
  }
  else if (f === 'gsel') { gsel = el.value === 'all' ? 'all' : +el.value; render(); }
  else if (f === 'pen') { const mid = openId, v = el.value; write(() => DB.update('matches/' + mid, {pen: v})); }
  else if (f === 'notes') { const mid = openId, v = el.value.slice(0, 400); write(() => DB.update('matches/' + mid, {notes: v})); }
});
document.addEventListener('focusout', () => { if (dirty) setTimeout(() => { if (dirty) renderSnap(); }, 350); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const el = e.target;
  if (el.id === 'newteam') document.querySelector('[data-act="addteam"]').click();
  else if (el.id === 'lg-pw') doLogin();
  else if (el.dataset && el.dataset.pl) document.querySelector(`[data-act="addplayer"][data-id="${el.dataset.pl}"]`).click();
});

/* ---------- sincronizzazione ---------- */
let slowTimer = null;
function checkReady() {
  if (ready.teams && ready.matches && ready.meta) { syncState = 'ok'; clearTimeout(slowTimer); }
  renderSnap();
}
function onErr() { clearTimeout(slowTimer); syncState = 'slow'; render(); }

async function init() {
  render();
  if (!firebaseConfig || /INCOLLA/.test(firebaseConfig.apiKey || 'INCOLLA')) { fs = null; syncState = 'off'; render(); return; }
  try {
    const app = initializeApp(firebaseConfig);
    fs = getFirestore(app);
    auth = getAuth(app);
  } catch (e) { fs = null; syncState = 'off'; render(); return; }

  slowTimer = setTimeout(() => { if (syncState !== 'ok') { syncState = 'slow'; render(); } }, 10000);

  // i dati sono pubblici in lettura: parte subito, senza aspettare l'accesso
  onSnapshot(collection(fs, 'teams'), s => { teams = {}; s.docs.forEach(d => teams[d.id] = d.data()); ready.teams = true; checkReady(); }, onErr);
  onSnapshot(collection(fs, 'matches'), s => { matches = {}; s.docs.forEach(d => matches[d.id] = {...d.data(), id: d.id}); ready.matches = true; checkReady(); }, onErr);
  onSnapshot(doc(fs, 'meta', 'info'), s => { if (s.exists()) meta = {...meta, ...s.data()}; else meta = {name: 'Torneo di Calcio a 5'}; ready.meta = true; checkReady(); }, onErr);

  onSnapshot(doc(fs, 'meta', 'giornate'), s => { gdates = s.exists() ? (s.data().d || {}) : {}; gtimes.camp = s.exists() ? (s.data().t || {}) : {}; gnot.camp = s.exists() ? (s.data().n || {}) : {}; renderSnap(); }, onErr);
  onSnapshot(doc(fs, 'meta', 'giornateC'), s => { gdatesC = s.exists() ? (s.data().d || {}) : {}; gtimes.champ = s.exists() ? (s.data().t || {}) : {}; gnot.champ = s.exists() ? (s.data().n || {}) : {}; renderSnap(); }, onErr);
  try { chatSeen = +(localStorage.getItem(CSEEN) || 0); } catch (e) {}
  onSnapshot(query(collection(fs, 'chat'), orderBy('ts', 'desc'), limit(100)), s => {
    chat = s.docs.map(d => ({...d.data(), id: d.id})).sort((a, b) => a.ts - b.ts);
    if (modalKind === 'chat') { chatSeenNow(); renderChatList(); }
    updateChatBadge();
  }, onErr);
  onSnapshot(collection(fs, 'notices'), s => {
    const prev = new Set(notices.map(n => n.id));
    notices = s.docs.map(d => ({...d.data(), id: d.id})).sort((x, y) => y.ts - x.ts);
    if (!noticeBoot) {
      noticeBoot = true;
      const st = seenGet();
      if (st === null) seenSet(notices[0] ? notices[0].ts : Date.now()); else seenTs = st;
    } else {
      const fresh = notices.filter(n => !prev.has(n.id) && n.ts > seenTs);
      if (fresh.length) { const f0 = fresh[0], lk = f0.cal ? {c: 'cal', g: 0} : f0.g ? {c: f0.c === 'champ' ? 'champ' : 'camp', g: +f0.g} : null; toast('🔔 ' + f0.text + (lk ? ' · tocca per vedere' : ''), lk); }
      if (modalKind === 'notices' && notices[0]) seenSet(notices[0].ts);
    }
    renderSnap();
  }, onErr);

  // accesso anonimo: serve solo per riconoscere il dispositivo dei gestori
  try { const cred = await signInAnonymously(auth); me = cred.user.uid; verifyRole(); }
  catch (e) { toast('Accesso anonimo non attivo (vedi GUIDA.md)'); }
}
init();
{ const im = new Image(); im.onload = () => document.documentElement.classList.add('bgimg'); im.src = 'sfondo.jpg'; }
try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js'); } catch (e) {}
</script>
